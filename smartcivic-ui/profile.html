<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartCivic — Citizen Profile</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Gurmukhi:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="pg" style="width: 100%">
      <header class="nav">
        <a class="logo" href="index.html" style="text-decoration: none"
          >SmartCivic</a
        >
        <nav class="nl" aria-label="Main">
          <a href="index.html">Home</a
          ><a href="register-complaint.html">Register Complaint</a
          ><a href="my-complaints.html">My Complaints</a
          ><a href="faq.html">FAQ</a
          ><a href="announcements.html">Announcements</a
          ><a href="profile.html" class="on">Profile</a>
        </nav>
        <span class="sp"></span
        ><select class="f" style="width: 112px" aria-label="Language">
          <option>English</option>
          <option>हिन्दी</option>
          <option>ਪੰਜਾਬੀ</option></select
        ><button class="b s" data-theme-toggle>Theme</button
        ><button class="b s">Alerts <span class="bd rev">3</span></button
        ><span class="av" role="img" aria-label="Profile: Gurpreet Singh"
          >GS</span
        >
      </header>
      <div class="w">
        <h1>My Profile</h1>
        <div class="cols">
          <div class="c">
            <div class="row" style="justify-content: flex-start">
              <span
                class="av"
                style="width: 72px; height: 72px; font-size: 24px"
                role="img"
                aria-label="Profile picture"
                >GS</span
              ><button class="b s">Change Photo</button>
            </div>
            <div class="g2">
              <div>
                <label>Full Name</label
                ><input class="f" value="Gurpreet Singh" placeholder="" />
              </div>
              <div>
                <label>Email Address</label
                ><input class="f" value="gurpreet@example.com" placeholder="" />
              </div>
              <div>
                <label>Phone Number</label
                ><input class="f" value="+91 98xxx xxxxx" placeholder="" />
              </div>
              <div>
                <label>Preferred Language</label
                ><select class="f">
                  <option>English</option>
                  <option>हिन्दी</option>
                  <option>ਪੰਜਾਬੀ</option>
                </select>
              </div>
            </div>
            <div>
              <label>Address</label
              ><input
                class="f"
                value="Model Town, Ludhiana, Punjab"
                placeholder=""
              />
            </div>
            <div class="row">
              <button class="b s">Cancel</button
              ><button class="b">Save Changes</button>
            </div>
          </div>
          <div style="display: grid; gap: 16px; align-content: start">
            <div class="c">
              <h3>Preferences</h3>
              <label><input type="checkbox" checked /> Email updates</label
              ><label><input type="checkbox" checked /> SMS updates</label>
              <div>
                <label>Theme</label
                ><select class="f">
                  <option>Light</option>
                  <option>Dark</option>
                  <option>System</option>
                </select>
              </div>
            </div>
            <div class="c bg">
              <h3>Account security</h3>
              <p>Password changed 3 months ago.</p>
              <button class="b s">Change Password</button
              ><button class="b d">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var p = document.querySelector(".pg"),
          k = "sc-theme",
          s = null;
        try {
          s = localStorage.getItem(k);
        } catch (e) {}
        if (s) p.classList.toggle("dark", s === "dark");
        document.querySelectorAll("[data-theme-toggle]").forEach(function (b) {
          b.addEventListener("click", function () {
            var d = p.classList.toggle("dark");
            try {
              localStorage.setItem(k, d ? "dark" : "light");
            } catch (e) {}
          });
        });
        document
          .querySelectorAll('select[aria-label="Language"]')
          .forEach(function (x) {
            x.addEventListener("change", function () {
              document.documentElement.lang = ["en", "hi", "pa"][
                x.selectedIndex
              ];
            });
          });
      })();
    </script>
  </body>
</html>
